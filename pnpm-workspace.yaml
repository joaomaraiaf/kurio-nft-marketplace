# Repo de pacote único: o pnpm v11 trata este arquivo como workspace e exige `packages`.
packages:
  - '.'

# Endurecimento contra ataques de supply chain (pnpm v11 lê settings daqui):
minimumReleaseAge: 10080 # 7 dias em minutos (evita instalar releases recém-publicadas)
blockExoticSubdeps: true # bloqueia dependências transitivas via git/tarball/path
strictDepBuilds: true # falha o install se um pacote fora da allowlist tentar rodar build script

# Allowlist explícita de pacotes autorizados a rodar postinstall/build scripts.
allowBuilds:
  msw: true # atualiza o Service Worker em public/
  '@biomejs/biome': true # binário nativo do linter/formatter
  sharp: true # otimização local das imagens WebP

# Overrides de segurança para dependências transitivas ativas no lockfile.
overrides:
  # Mantém o peer do @axe-core/playwright alinhado ao Chromium usado nas auditorias.
  'playwright-core': '1.58.2'
  # Correções de severidade alta na cadeia de CSS parser / source map do PostCSS.
  'postcss@<8.5.23': '>=8.5.23 <9.0.0'
  'nanoid@<3.3.18': '>=3.3.18 <4.0.0'
  'source-map-js@<1.2.2': '>=1.2.2 <2.0.0'
  # form-data (sub-dep do axios): evita CRLF injection (GHSA-hmw2-7cc7-3qxx).
  'form-data@>=4.0.0 <4.0.6': '>=4.0.6 <5.0.0'
  # undici (sub-dep do jsdom/vitest): mantém na linha 7.x corrigida sem quebrar require interno na 8.x.
  'undici@>=7.0.0 <7.29.1': '>=7.29.1 <8.0.0'
  # @opentelemetry/core (sub-dep transitiva do Lighthouse): corrige GHSA-8988-4f7v-96qf mantendo linha 2.x.
  '@opentelemetry/core@<2.8.0': '>=2.8.0 <3.0.0'
